{% extends 'base.html' %}

{% block title %}Nuevo Restaurante{% endblock %}

{% block content %}
  <h1>Agregar nuevo restaurante</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
  </form>

  <a href="{% url 'restaurante_list' %}">Volver al listado</a>
{% endblock %}
